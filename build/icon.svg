<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16212b"/>
      <stop offset="1" stop-color="#0f1720"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="46" fill="url(#bg)"/>

  <!-- three diagram nodes joined by lines, echoing a flowchart -->
  <line x1="70" y1="182" x2="128" y2="96" stroke="#3fa796" stroke-width="6" stroke-linecap="round"/>
  <line x1="128" y1="96" x2="186" y2="182" stroke="#3fa796" stroke-width="6" stroke-linecap="round"/>
  <line x1="70" y1="182" x2="186" y2="182" stroke="#3fa796" stroke-width="6" stroke-linecap="round" opacity="0.55"/>

  <circle cx="70" cy="182" r="14" fill="#0f1720" stroke="#c9a34e" stroke-width="6"/>
  <circle cx="186" cy="182" r="14" fill="#0f1720" stroke="#c9a34e" stroke-width="6"/>

  <!-- the vault diamond, larger, at the apex -->
  <path d="M128 56 L166 96 L128 136 L90 96 Z" fill="#c9a34e"/>
  <path d="M128 74 L150 96 L128 118 L106 96 Z" fill="#0f1720" opacity="0.35"/>
</svg>
